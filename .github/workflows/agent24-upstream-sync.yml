name: Agent24 upstream tracking

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

# 只有推镜像用组织 App「iDoris WeKnora Sync」的 1 小时安装令牌：内置 GITHUB_TOKEN 无法获得
# workflows 权限，推不动改了 .github/workflows/ 的上游提交。查询与创建同步 PR 仍用内置 GITHUB_TOKEN，
# 它开的 PR 不会自动运行上游工作流，CI 要等人评审后关闭再重开 PR 才运行。
# 凭据设置、评审步骤与轮换见 docs/agent24/FORK-MAINTENANCE.md。
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: agent24-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'iDoris-ai/WeKnora'
    runs-on: ubuntu-latest
    # App 私钥与 Client ID 只存在这个 Environment，部署分支策略只允许 a24/develop。
    # 镜像推送触发的上游工作流跑在别的 ref 上，读不到它们。
    environment: upstream-sync
    steps:
      - name: Require sync App credentials
        env:
          CLIENT_ID: ${{ vars.WEKNORA_SYNC_APP_CLIENT_ID }}
          HAS_KEY: ${{ secrets.WEKNORA_SYNC_APP_PRIVATE_KEY != '' }}
        shell: bash
        run: |
          if [ -z "$CLIENT_ID" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::error::缺少 vars.WEKNORA_SYNC_APP_CLIENT_ID 或 secrets.WEKNORA_SYNC_APP_PRIVATE_KEY，见 docs/agent24/FORK-MAINTENANCE.md"
            exit 1
          fi
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.WEKNORA_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.WEKNORA_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: WeKnora
          permission-contents: write
          permission-workflows: write
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: a24/develop
          fetch-depth: 0
          # git push 用 App 令牌；gh 命令另用下面的 GH_TOKEN（内置 GITHUB_TOKEN）
          token: ${{ steps.app-token.outputs.token }}
      - name: Fast-forward mirrors and propose release integration
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/Tencent/WeKnora.git
          git fetch --no-tags upstream refs/heads/main:refs/remotes/upstream/main
          release_tag=$(gh api repos/Tencent/WeKnora/releases/latest \
            --jq 'select(.draft == false and .prerelease == false) | .tag_name')
          test -n "$release_tag"
          git check-ref-format "refs/tags/$release_tag"
          git fetch --no-tags upstream "refs/tags/$release_tag"
          release_sha=$(git rev-parse 'FETCH_HEAD^{commit}')
          git fetch --no-tags origin \
            refs/heads/upstream-main:refs/remotes/origin/upstream-main \
            refs/heads/upstream-release:refs/remotes/origin/upstream-release \
            refs/heads/a24/develop:refs/remotes/origin/a24/develop

          # Verify both histories before changing either mirror. Never force push.
          git merge-base --is-ancestor origin/upstream-main upstream/main
          git merge-base --is-ancestor origin/upstream-release "$release_sha"

          # 以 upstream-release 为 head 的 PR 打开期间，用 App 令牌推进它会以 App 身份触发
          # synchronize，自动运行未评审的上游 PR 工作流。所以此时只推进 upstream-main。
          open_pr=$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --head upstream-release --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$open_pr" ]; then
            targets=("$(git rev-parse upstream/main)" upstream-main)
            refspecs=(refs/remotes/upstream/main:refs/heads/upstream-main)
          else
            targets=("$(git rev-parse upstream/main)" upstream-main "$release_sha" upstream-release)
            refspecs=(refs/remotes/upstream/main:refs/heads/upstream-main "$release_sha:refs/heads/upstream-release")
          fi
          # 用 App 令牌推送会触发被推送提交里的 push 工作流（上游代码，未经评审）；
          # 有任何会被镜像推送激活的触发就停止，交给人处理。
          ruby .github/scripts/agent24-mirror-trigger-guard.rb "${targets[@]}"
          git push --atomic origin "${refspecs[@]}"
          {
            echo "Upstream main: $(git rev-parse upstream/main)"
            echo "Stable release: $release_tag ($release_sha)"
            echo "Product branch: unchanged; updates require a reviewed merge."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$open_pr" ]; then
            echo "同步 PR #$open_pr 仍打开：upstream-release 本次未推进，合并或关闭该 PR 后下次运行继续。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if git merge-base --is-ancestor "$release_sha" origin/a24/develop; then
            echo "Product branch already contains this release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat > /tmp/upstream-sync-pr.md <<EOF
          上游正式版：$release_tag
          固定提交：$release_sha

          本 PR 仅提议将 upstream-release 正常 merge 到 a24/develop；禁止 reset、强推和整树覆盖。
          评审须核对 Agent24 适配、身份/权限、取消、引用、数据迁移和恢复，以及补丁清单。
          冲突必须逐项解决；保留 docs/agent24 与二次开发 feature，不以 ours/theirs 批量掩盖。

          **CI 尚未运行。** 本 PR 由内置 GITHUB_TOKEN 创建，不会自动运行上游的工作流。
          1. 先评审上游对工作流与 action 的改动：git diff origin/a24/develop...upstream-release -- .github/
             重点看新增或改动的 pull_request 工作流是否申请写权限、引用 secret 或调用外部 action。
          2. 确认无害后，关闭并重新打开本 PR，以评审人身份触发适用检查；检查实际运行并通过后才能合并。
          本 PR 打开期间同步工作流不会推进 upstream-release，head 不会在评审后变动。
          本工作流不批准或合并 PR，也不把上游开发版自动送进产品分支。
          EOF
          gh pr create --repo "$GITHUB_REPOSITORY" \
            --base a24/develop --head upstream-release \
            --title "chore(upstream): 同步正式版 $release_tag" \
            --body-file /tmp/upstream-sync-pr.md
