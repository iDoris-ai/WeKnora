# Agent24 fork product patch A24-KB-61 (KB-LITE-01b): workflow_dispatch build of a fixed-SHA headless Lite artifact.
name: Agent24 Lite Headless

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "完整 40 位源码 SHA"
        required: true
        type: string
      signed:
        description: "Sign the manifest with AGENT24_LITE_SIGNING_KEY"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: agent24-lite-headless-${{ inputs.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Check source SHA
        env:
          SHA: ${{ inputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if ! printf '%s' "$SHA" | grep -E '^[0-9a-f]{40}$' >/dev/null; then
            echo "ERROR: sha must be 40 lowercase hex characters" >&2
            exit 1
          fi
          head=$(git rev-parse HEAD)
          if [ "$head" != "$SHA" ]; then
            echo "ERROR: HEAD ${head} does not match input SHA" >&2
            exit 1
          fi

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Prepare signing key
        if: ${{ inputs.signed }}
        env:
          SIGNING_KEY: ${{ secrets.AGENT24_LITE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY" ]; then
            echo "ERROR: AGENT24_LITE_SIGNING_KEY is empty" >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/lite-sign.key"
          chmod 600 "$RUNNER_TEMP/lite-sign.key"

      - name: Build headless artifact
        env:
          SHA: ${{ inputs.sha }}
          SIGNED: ${{ inputs.signed }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SIGNED" = "true" ]; then
            bash scripts/agent24/build-lite-headless.sh "$SHA" --out dist-agent24 --sign-key "$RUNNER_TEMP/lite-sign.key"
          elif [ "$SIGNED" = "false" ]; then
            bash scripts/agent24/build-lite-headless.sh "$SHA" --out dist-agent24 --unsigned
          else
            echo "ERROR: signed input must be true or false" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: weknora-lite-headless
          path: dist-agent24/*
          retention-days: 14

      - name: Remove signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/lite-sign.key"
